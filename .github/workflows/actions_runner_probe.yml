name: Actions Runner Probe

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify runner execution
        run: |
          echo "GitHub Actions runner is executing normally."
          echo "SHA: $GITHUB_SHA"
          echo "RUN_ID: $GITHUB_RUN_ID"
