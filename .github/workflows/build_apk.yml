name: Build NaqshKaar Designer

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - name: Check Flutter
        run: flutter --version
      - name: Generate Android project
        run: flutter create --platforms=android --project-name naqshkaar_designer .
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Build APK
        run: flutter build apk --release
      - name: Build Play Store AAB
        run: flutter build appbundle --release
      - name: Verify release artifacts
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          test -s build/app/outputs/bundle/release/app-release.aab
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NaqshKaar-Designer-APK
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: NaqshKaar-Designer-AAB
          path: build/app/outputs/bundle/release/app-release.aab
