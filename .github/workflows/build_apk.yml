name: Build NaqshKaar Designer

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - name: Check Flutter
        run: flutter --version
      - name: Generate Android project
        run: flutter create --platforms=android --org com.naqshkaar .
      - name: Install Android API 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
      - name: Configure Android plugin compatibility
        run: |
          printf '\nandroid.builtInKotlin=false\n' >> android/gradle.properties
          printf 'android.newDsl=false\n' >> android/gradle.properties
      - name: Set Android compile SDK to 36
        run: |
          sed -i -E 's/^[[:space:]]*compileSdk[[:space:]]*=.*/    compileSdk = 36/' android/app/build.gradle.kts
          grep -n "compileSdk" android/app/build.gradle.kts
      - name: Preflight Python transformation scripts
        run: python3 -m py_compile scripts/*.py
      - name: Download bundled Urdu fonts
        run: |
          mkdir -p assets/fonts
          curl -fL --retry 3 -o assets/fonts/Gulzar-Regular.ttf https://raw.githubusercontent.com/googlefonts/Gulzar/main/fonts/ttf/Gulzar-Regular.ttf
          curl -fL --retry 3 -o assets/fonts/NotoNastaliqUrdu-Regular.ttf https://raw.githubusercontent.com/harfbuzz/harfbuzz-monster-fonts/main/NotoNastaliqUrdu-Regular.ttf
          curl -fL --retry 3 -o assets/fonts/MehrNastaliq.ttf https://raw.githubusercontent.com/abbassiddiqi/mehr/master/mehr.ttf
          curl -fL --retry 3 -o assets/fonts/AlviNastaleeq.ttf https://raw.githubusercontent.com/imrofayel/UrduFonts/master/fonts/AlviNastaleeq.ttf
          curl -fL --retry 3 -o assets/fonts/JameelNooriNastaleeq.ttf https://raw.githubusercontent.com/abid-mujtaba/ttf-jameel-noori-nastaleeq/master/Jameel%20Noori%20Nastaleeq.ttf
          curl -fL --retry 3 -o assets/fonts/AlMajeedQuranic.ttf https://fontly-virid.vercel.app/fonts/ttf/al-majeed-quranic-font-shiped.ttf
          curl -fL --retry 3 -o assets/fonts/BombayBlack.ttf https://www.urdufont.org/download.php?id=737645
          for font in assets/fonts/*.ttf; do test -s "$font" || exit 1; done
      - name: Get dependencies
        run: flutter pub get
      - name: Remove generated default test
        run: rm -rf test
      - name: Normalize generated compatibility issue
        run: sed -i 's/Icons\.rotate_0_degrees_ccw_rounded/Icons.rotate_left_rounded/g' lib/screens/workspace_screen.dart
      - name: Apply premium Urdu font catalog
        run: python3 scripts/font_catalog_upgrade.py
      - name: Fix generated composer syntax
        run: python3 scripts/fix_generated_composer_syntax.py
      - name: Apply final professional toolbar polish
        run: python3 scripts/final_toolbar_polish.py
      - name: Apply canvas interaction upgrade
        run: python3 scripts/canvas_interaction_upgrade.py
      - name: Apply professional Image Studio
        run: python3 scripts/image_studio_upgrade.py
      - name: Apply advanced Layers Studio
        run: python3 scripts/advanced_layers_upgrade.py
      - name: Fix Layers Studio build integration
        run: python3 scripts/layers_studio_build_fix.py
      - name: Apply Typography Studio
        run: python3 scripts/typography_studio_upgrade.py
      - name: Apply reliability and autosave upgrade
        run: python3 scripts/reliability_upgrade.py
      - name: Apply export memory safety
        run: python3 scripts/export_safety_upgrade.py
      - name: Apply remaining Studio tool hub
        run: python3 scripts/remaining_tools_upgrade.py
      - name: Apply premium non-blocking live-preview controls
        run: python3 scripts/premium_workspace_ui_upgrade.py
      - name: Correct premium workspace UI transformation
        run: python3 scripts/fix_premium_workspace_ui.py
      - name: Apply premium Jameel-first text composer
        run: python3 scripts/premium_text_composer_upgrade.py
      - name: Wire premium text composer imports
        run: python3 scripts/premium_text_composer_imports.py
      - name: Correct live canvas size panel
        run: python3 scripts/fix_premium_canvas_size.py
      - name: Apply smart selection bounds and paper resize controls
        run: python3 scripts/paper_resize_and_selection_upgrade.py
      - name: Fix generated controller flow-control style
        run: python3 scripts/controller_flow_control_fix.py
      - name: Apply premium editor catalogs and mobile UX fixes
        run: python3 scripts/premium_editor_catalog_upgrade.py
      - name: Repair premium editor catalog integration
        run: python3 scripts/premium_editor_catalog_repair.py
      - name: Deep screenshot-driven UX polish
        run: python3 scripts/deep_screenshot_polish.py
      - name: Deep functional repair and responsive UX pass
        run: python3 scripts/deep_functional_repair.py
      - name: Compact premium home grid
        run: python3 scripts/home_compact_polish.py
      - name: Final catalog renderer safety repair
        run: python3 scripts/final_catalog_render_repair.py
      - name: Final runtime catalog visibility repair
        run: python3 scripts/final_runtime_catalog_visibility_repair.py
      - name: Normalize editor layer labels
        run: python3 scripts/pre_editor_ux_layer_label.py
      - name: Deterministic final editor UX repair
        run: python3 scripts/final_editor_ux_repair_v2.py
      - name: Final live preview and selection UX repair
        run: python3 scripts/final_live_preview_and_selection_recovery.py
      - name: Harden continuous editor checkpoints
        run: python3 scripts/continuous_edit_checkpoint_hardening.py
      - name: Final editor UX safety gate
        run: python3 scripts/final_editor_ux_safety.py
      - name: Deep continuous-edit regression gate
        run: python3 scripts/continuous_edit_checkpoint_hardening.py
      - name: Final screenshot-driven acceptance polish
        run: python3 scripts/final_acceptance_polish.py
      - name: Disable only the non-build-blocking curly-braces lint
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('analysis_options.yaml')
          text = path.read_text(encoding='utf-8')
          rule = 'curly_braces_in_flow_control_structures: false'
          if rule not in text:
              marker = 'linter:\n'
              rules_marker = '  rules:\n'
              if marker not in text or rules_marker not in text:
                  raise SystemExit('Expected Flutter-generated linter/rules block was not found')
              text = text.replace(rules_marker, rules_marker + '    ' + rule + '\n', 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Normalize unsupported Text API before analyzer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/widgets/design_canvas.dart')
          lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
          kept = [line for line in lines if 'textHeightBehavior:' not in line]
          if len(kept) == len(lines):
              print('No generated textHeightBehavior parameter found.')
          else:
              path.write_text(''.join(kept), encoding='utf-8')
              print('Removed generated textHeightBehavior parameter.')
          PY
      - name: Apply safe Dart analyzer fixes
        run: dart fix --apply
      - name: Format generated Dart sources
        run: dart format lib
      - name: Analyze
        run: flutter analyze
      - name: Build APK
        run: flutter build apk --release
      - name: Build Play Store AAB
        run: flutter build appbundle --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NaqshKaar-Designer-APK
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: NaqshKaar-Designer-AAB
          path: build/app/outputs/bundle/release/app-release.aab
